name: liuqin UEFI

# Stage 1 of the Xiaomi Pad 6 Pro (liuqin) bring-up: the Mu-Silicium firmware with the
# UniXNU boot manager and DarwinBoot, packed as an Android boot v4 image that the stock ABL
# accepts with `fastboot boot` (RAM only, nothing is flashed).
#
# Pass: the tablet leaves the Xiaomi logo for the UniXNU menu on the 1800x2880 panel.
#
# The ABL selects the appended DTB by qcom,msm-id/board-id, so the image carries the stock
# "Cape SoC" base DTB of liuqin's own vendor_boot. By default it comes from the release
# stock_release of this repository: an AES-256 7z (password LIUQIN_ARTIFACT_PASSWORD) with
# liuqin-cape.dtb, uefi.img (uefi.elf) and stock-manifest.json of the build on the tablet,
# packed from its fastboot ROM. Given ota_url, a Xiaomi full OTA package is read instead
# (range requests only for vendor_boot, uefi and dtbo). With binaries=liuqin the vendor UEFI
# modules also come from that uefi.elf instead of the pong SM8475 set.
#
# Xiaomi and Qualcomm bytes are not committed. The repository is public, so the run's
# artifact holds them only inside an AES-256 7z (encrypted file names too) whose password is
# the repository secret LIUQIN_ARTIFACT_PASSWORD; the run stops before building without it.
# Extract with `7z x liuqin-uefi.7z`, then delete the run.

on:
  workflow_dispatch:
    inputs:
      stock_release:
        description: "Release of this repository with the encrypted stock inputs"
        type: string
        default: "stock-V14.0.9.0.TMYCNXM"
      ota_url:
        description: "Optional: https URL of a liuqin full OTA zip instead (Xiaomi recovery ROM, payload.bin inside)"
        type: string
        default: ""
      binaries:
        description: "Vendor UEFI modules: pong (public SM8475 set) or liuqin (from the OTA uefi partition)"
        type: choice
        options: ["pong", "liuqin"]
        default: "pong"
      target:
        description: "EDK II target"
        type: choice
        options: ["DEBUG", "RELEASE"]
        default: "DEBUG"

permissions:
  contents: read

env:
  CI_BUILD: true
  OTA_URL: ${{ inputs.ota_url }}
  STOCK_RELEASE: ${{ inputs.stock_release }}
  BINARIES: ${{ inputs.binaries }}
  TARGET: ${{ inputs.target }}

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ARTIFACT_PASSWORD: ${{ secrets.LIUQIN_ARTIFACT_PASSWORD }}
    steps:
      - name: artifact password
        run: |
          if [ "${#ARTIFACT_PASSWORD}" -lt 12 ]; then
            echo "::error::Set the repository secret LIUQIN_ARTIFACT_PASSWORD (12+ characters) first; the artifact carries vendor files and is only uploaded encrypted."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          path: uefi-liuqin
          submodules: recursive
      - name: tools
        working-directory: uefi-liuqin
        run: |
          set -euo pipefail
          bash ./setup_env.sh -p apt
          python3 -m pip install --break-system-packages -r pip-requirements.txt zstandard
      - name: stock liuqin inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${OTA_URL}" ]; then
            python3 uefi-liuqin/scripts/fetch-liuqin-stock.py --package "${OTA_URL}" --out "${RUNNER_TEMP}/stock"
          else
            gh release download "${STOCK_RELEASE}" -R "${GITHUB_REPOSITORY}" -p '*.7z' -D "${RUNNER_TEMP}/dl"
            7z x -y "-p${ARTIFACT_PASSWORD}" "-o${RUNNER_TEMP}/stock" "${RUNNER_TEMP}"/dl/*.7z > /dev/null
            python3 - "${RUNNER_TEMP}/stock" <<'EOF'
          import hashlib, json, sys
          from pathlib import Path
          d = Path(sys.argv[1])
          m = json.loads((d / "stock-manifest.json").read_text())
          for name, want in m["files"].items():
              got = hashlib.sha256((d / name).read_bytes()).hexdigest()
              assert got == want["sha256"], f"{name}: {got} != {want['sha256']}"
          print(f"stock {m['build']}: {', '.join(m['files'])} verified")
          EOF
          fi
          cp "${RUNNER_TEMP}/stock/liuqin-cape.dtb" uefi-liuqin/Resources/DTBs/liuqin.dtb
          cat "${RUNNER_TEMP}/stock/stock-manifest.json"
      - name: liuqin vendor modules
        if: ${{ inputs.binaries == 'liuqin' }}
        working-directory: uefi-liuqin
        run: |
          set -euo pipefail
          python3 scripts/import-liuqin-binaries.py --uefi-elf "${RUNNER_TEMP}/stock/uefi.img"
          sed -i 's/^\(  BINARIES_DEVICE *= *\)pong$/\1liuqin/' Platforms/Xiaomi/liuqinPkg/liuqin.dsc
          grep -n 'BINARIES_DEVICE  ' Platforms/Xiaomi/liuqinPkg/liuqin.dsc
      - name: build
        working-directory: uefi-liuqin
        run: python3 build_uefi.py -d liuqin -r "${TARGET}"
      - name: collect
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/liuqin-uefi"
          mkdir -p "$out"
          cp uefi-liuqin/Mu-liuqin.img "$out/"
          cp "uefi-liuqin/Build/liuqinPkg/${TARGET}_CLANGPDB/FV/SILICIUM_UEFI.fd" "$out/"
          cp "${RUNNER_TEMP}/stock/stock-manifest.json" "$out/"
          [ -f uefi-liuqin/Binaries/liuqin/manifest.json ] && cp uefi-liuqin/Binaries/liuqin/manifest.json "$out/binaries-manifest.json" || true
          ( cd "$out" && sha256sum * > SHA256SUMS && cat SHA256SUMS )
          mkdir -p "${RUNNER_TEMP}/upload"
          ( cd "$out" && 7z a -t7z -mx=9 -mhe=on "-p${ARTIFACT_PASSWORD}" "${RUNNER_TEMP}/upload/liuqin-uefi.7z" . > /dev/null )
          7z t "-p${ARTIFACT_PASSWORD}" "${RUNNER_TEMP}/upload/liuqin-uefi.7z" | tail -3
          rm -rf "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: liuqin-uefi-${{ inputs.binaries }}-${{ inputs.target }}
          path: ${{ runner.temp }}/upload/liuqin-uefi.7z
          compression-level: 0
          retention-days: 1
